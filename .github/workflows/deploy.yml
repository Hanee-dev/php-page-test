# main 브랜치에 push되면 deploy/ 내용을 Cafe24 FTP 최상위(/)에 동기화
# (config/src/templates 는 www 바깥, www/ 가 웹 루트)
#
# 필요한 설정 (GitHub 저장소 → Settings → Secrets and variables → Actions)
#   Secrets   : FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
#   Variables : FTP_PROTOCOL   (선택, 기본 ftp — 호스팅이 지원하면 ftps 권장)
#               FTP_SERVER_DIR (선택, 기본 / — 절대 경로로 지정, 끝에 / 필수)
#
# Cafe24 FTP 주의: 로그인 시 /www 에서 시작하고, 국내 IP 제한이 켜져 있으면 Actions(해외 IP)에서 쓰기 불가
name: Deploy to Cafe24

on:
  push:
    branches: [main]
    paths:
      - 'deploy/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: PHP 문법 검사
        run: find deploy -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: FTP 배포
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftp' }}
          local-dir: ./deploy/
          server-dir: ${{ vars.FTP_SERVER_DIR || '/' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/README.txt
